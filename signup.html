    <div class="event-period">📅 報名期間：即日起 ～ 2026/08/15</div>
    
    <h3>🎯 挑戰規則 (開台時間請看 Discord 公告)</h3>
    <ul>
      <li>📝 <b>報名期間：</b> 即刻起至 <b>2026/08/15</b></li>
      <li>🟢 <b>開放挑戰：</b> 2026/07/20 ～ 2026/08/20</li>
      <li>🔒 <b>挑戰限制：</b> 僅限直播時間進行挑戰，每人最多限挑戰 <b>10 次</b>。</li>
      <li>👤 <b>對局說明：</b> 主播會親自下場打牌，但主播的成績<b>不計分數</b>；其餘兩名玩家由主播於現場隨機抽出。</li>
      <li>🀄 <b>胡牌規定：</b> 僅限胡<b>「役滿」</b>牌型(不含累計役滿)。若胡其他牌型，第一次給予警告，第二次將直接<b>取消資格</b>。</li>
    </ul>
  </div>
